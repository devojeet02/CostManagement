<div class="dp-wrapper">

  <!-- Input trigger -->
  <div class="dp-input-wrap" [class.open]="isOpen" (click)="toggleCalendar($event)">
    <input
      class="dp-input"
      [value]="displayValue"
      [placeholder]="placeholder"
      readonly
    />
    <svg class="dp-cal-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14"
      viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
      <line x1="16" y1="2" x2="16" y2="6"/>
      <line x1="8" y1="2" x2="8" y2="6"/>
      <line x1="3" y1="10" x2="21" y2="10"/>
    </svg>
  </div>

  <!-- Calendar dropdown -->
  <div class="dp-dropdown" *ngIf="isOpen" (click)="$event.stopPropagation()">

    <!-- Month / Year navigation -->
    <div class="dp-nav">
      <button type="button" class="dp-nav-btn" (click)="prevMonth()">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
      <span class="dp-nav-label">{{ headerLabel }}</span>
      <button type="button" class="dp-nav-btn" (click)="nextMonth()">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </button>
    </div>

    <!-- Weekday headers -->
    <div class="dp-grid">
      <span class="dp-wkd" *ngFor="let d of weekDays">{{ d }}</span>

      <!-- Day cells -->
      <span
        *ngFor="let day of calendarDays"
        class="dp-day"
        [class.dp-day--empty]="!day"
        [class.dp-day--selected]="isSelected(day)"
        [class.dp-day--today]="isToday(day)"
        (click)="selectDay(day)"
      >{{ day }}</span>
    </div>

  </div>
</div>
